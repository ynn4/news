name: Validate news.json

# Runs automatically whenever public/news.json changes, on any branch/PR.
# If the file is invalid, this check fails. Set it as a "required status
# check" on the main branch (Settings -> Branches -> Branch protection
# rules) so a bad news.json literally cannot be merged/deployed.

on:
  push:
    paths:
      - "public/news.json"
  pull_request:
    paths:
      - "public/news.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run validator
        run: node validate-news.js public/news.json
